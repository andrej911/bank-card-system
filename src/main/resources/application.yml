spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_card_db}
    username: ${DB_USERNAME:postgres}
    # Значения по умолчанию нет: нет DB_PASSWORD, приложение не стартует (fail-fast).
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Схемой владеет Liquibase, Hibernate только проверяет соответствие.
      ddl-auto: validate
    # JPA-сессия не живёт весь HTTP-запрос: работа с БД только в сервисах.
    open-in-view: false

  liquibase:
    change-log: classpath:db/migration/db.changelog-master.xml

logging:
  level:
    # SQL-запросы Hibernate через обычный логгер.
    org.hibernate.SQL: DEBUG

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration:
      ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:}

  card:
    # AES-256 ключ шифрования номеров карт (32 байта в Base64).
    encryption-key: ${CARD_ENCRYPTION_KEY}
    # Отдельный ключ HMAC для хэша номера (уникальность и поиск).
    hash-key: ${CARD_HASH_KEY}